name: Bootstrap LeanContext source

on:
  push:
    branches:
      - feat/leancontext-v0.1
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ hashFiles('.bootstrap/part-01.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/part-*.b64 | base64 --decode > /tmp/codex-leancontext-source.zip
          unzip -oq /tmp/codex-leancontext-source.zip -d .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish Codex LeanContext v0.1.0"
          git push origin HEAD
