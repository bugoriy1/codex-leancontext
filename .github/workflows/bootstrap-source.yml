name: Bootstrap LeanContext source

on:
  push:
    branches:
      - feat/leancontext-v0.1

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          if [ ! -f .bootstrap/part-01.b64 ]; then
            echo "Bootstrap files already removed."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          parts = [Path(f".bootstrap/part-{i:02d}.b64").read_text() for i in range(1, 6)]
          expected_part2_blob = "1197e6a5eca99f129eb797fe6ccf54f3e9a8585d"

          def git_blob_sha(text: str) -> str:
              payload = text.encode()
              return hashlib.sha1(f"blob {len(payload)}\0".encode() + payload).hexdigest()

          if git_blob_sha(parts[1]) != expected_part2_blob:
              repaired = None
              for i in range(len(parts[1])):
                  candidate = parts[1][:i] + parts[1][i + 1:]
                  if git_blob_sha(candidate) == expected_part2_blob:
                      repaired = candidate
                      print(f"Repaired part-02 by removing one extra character at offset {i}.")
                      break
              if repaired is None:
                  raise SystemExit("Unable to repair part-02")
              parts[1] = repaired

          Path("/tmp/source.b64").write_text("".join(parts))
          PY
          base64 --decode /tmp/source.b64 > /tmp/codex-leancontext-source.zip
          echo "91cbdd0254e2f555c0fb8de3af0d9f1ec3d4ce69c4a64f5a31a44c2ce6987538  /tmp/codex-leancontext-source.zip" | sha256sum --check -
          unzip -oq /tmp/codex-leancontext-source.zip -d .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish Codex LeanContext v0.1.0"
          git push origin HEAD
